server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sched_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 口令一律走环境变量 MYSQL_PASSWORD；本地默认值仅用于演示，真实口令不要提交到 Git
    password: ${MYSQL_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  task:
    scheduling:
      pool:
        # 默认只有 1 个线程，所有 @Scheduled 会串行排队：
        # 心跳会被故障转移扫描卡住，反过来又被判定"失联"，自己把自己摘了
        size: 3
      thread-name-prefix: sched-
  servlet:
    multipart:
      # 单文件上限与请求总上限；业务侧还会按 bizType 再做一次更严格的校验
      max-file-size: 10MB
      max-request-size: 12MB

sched:
  executor:
    app-name: sched-admin
    # 留空 = 自动探测 本机IP + server.port；多网卡或容器环境再显式指定
    address:
  heartbeat:
    interval-ms: 30000        # 心跳周期
    timeout-seconds: 90        # 3 个周期没心跳判定失联
  failover:
    interval-ms: 30000        # 故障转移扫描周期
    batch-timeout-minutes: 30 # 必须大于最长正常任务耗时，否则误杀正在跑的任务
  lock:
    lease-seconds: 90          # 主租约，建议 = 3 × failover.interval
  file:
    # local 表示本地磁盘；切换 MinIO/OSS 时新增实现并改这里，业务层不改
    storage-type: local
    # 上传根目录；禁止把该目录映射成静态资源，所有下载必须走 /api/file/**
    root-dir: ./data/upload
  security:
    # 本地调试用的固定登录用户ID；生产必须移除，改由 Spring Security + JWT 提供当前用户
    dev-user-id: 1

mybatis-plus:
  # XML 放在 sched-dao 的 resources/com/sched/dao/mapper/ 下，必须显式指定，否则默认只扫 classpath:/mapper/**
  mapper-locations: classpath*:com/sched/dao/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.sched: debug
